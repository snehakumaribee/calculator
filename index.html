<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="calculator">
        <h1>CALCULATOR</h1>
        <input id="screen" readonly>
        <div id="row1">
            <button onclick="entervalue('7')">7</button>
            <button onclick="entervalue('8')">8</button>
            <button onclick="entervalue('9')">9</button>
            <button onclick="entervalue('/')" class="operator">/</button>
        </div>
        <div id="row2">
            <button onclick="entervalue('4')">4</button>
            <button onclick="entervalue('5')">5</button>
            <button onclick="entervalue('6')">6</button>
            <button onclick="entervalue('*')" class="operator">x</button>
        </div>
        <div id="row3">
            <button onclick="entervalue('1')">1</button>
            <button onclick="entervalue('2')">2</button>
            <button onclick="entervalue('3')">3</button>
            <button onclick="entervalue('-')" class="operator">-</button>
        </div>
        <div id="row4">
            <button onclick="entervalue('0')">0</button>
            <button onclick="entervalue('.')">.</button>
            <button onclick="equalto()" id="equal">=</button>
            <button onclick="entervalue('+')" class="operator">+</button>
        </div>
        <div id="row5">
            <button onclick="clearscreen()" id="clear">clear</button>
            <button onclick="back()" id="back">back</button>
        </div>
    </div>
    <script src="style.js"></script>
</body>

</html>
